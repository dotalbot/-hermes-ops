expert_policy:
  risk_levels:
    level_0: mechanical documentation or formatting; no cross-model gate
    level_1: standard implementation; post-commit cross-model final review
    level_2: material architecture, security, UI, data, dependency, concurrency, or multi-module risk; pre/post expert review plus final review
    level_3: destructive, irreversible, production-data, credential, signing, release, deployment, or disputed work; expert review plus operator hold
  architecture:
    required_when:
    - architecture-change
    - cross-module-change
    - new-dependency
    - navigation-change
    - major-state-flow-change
    - drift-schema-or-migration
    - ssh-session-lifecycle
    - terminal-rendering
    - native-android-bridge
    - public-contract-change
    profile: jellybase_jellyssh_reviewer
    model:
      provider: openai-codex
      model: gpt-5.6-terra
      fallback: block
    bundle: architecture-review
    failure: block
  security:
    required_when:
    - credential-or-identity
    - secure-storage
    - private-key-or-passphrase
    - host-key
    - ssh-authentication
    - forwarding-or-proxyjump-or-mosh
    - socket-or-subprocess
    - external-network-service
    - log-or-diagnostic
    - export-or-backup-or-sharing-or-sync-or-screenshot
    - android-permission
    - keystore-or-signing-or-apk
    - clipboard
    - file-transfer
    - android-backup-or-storage
    - terminal-input-output
    - command-construction
    - analytics-or-crash-reporting
    profile: jellybase_jellyssh_reviewer
    model:
      provider: openai-codex
      model: gpt-5.6-terra
      fallback: block
    bundle: security-review
    failure: block
  ui:
    required_when:
    - screen-or-widget
    - navigation
    - connection-flow
    - terminal-control
    - keyboard
    - touch-gesture
    - responsive-layout
    - accessibility
    profile: jellybase_jellyssh_reviewer
    model:
      provider: openrouter
      model: google/gemini-3.1-pro-preview
      fallback: block
    bundle: ui-review
    failure: block
  database_data:
    required_when:
    - schema-or-migration
    - relationship-or-constraint-or-index
    - serialization-or-persistent-model
    - destructive-or-lossy-data
    - backfill-or-production-repair
    - data-import-export-contract
    - transaction-or-locking-or-concurrency
    - integrity-or-consistency
    - query-plan
    - etl-or-external-data-contract
    - pii-or-sensitive-data
    - retention-or-deletion-or-lineage
    - backup-or-restore-or-replication-or-disaster-recovery
    profile: jellybase_jellyssh_reviewer
    model:
      provider: openai-codex
      model: gpt-5.6-terra
      fallback: block
    bundle: database-data-review
    failure: block
  code_quality:
    required_when:
    - every-implementation
    profile: jellybase_jellyssh_reviewer
    model:
      provider: openai-codex
      model: gpt-5.6-terra
      fallback: block
    bundle: code-quality-review
    failure: block
  cross_model_final:
    required_when:
    - every-level-1-or-higher-implementation
    profile: jellybase_jellyssh_reviewer
    model:
      provider: openai-codex
      model: gpt-5.6-terra
      fallback: block
    bundle: final-review
    failure: block
execution_policy:
  auto_decompose: false
  max_spawn: 1
  max_in_progress: 1
  default_assignee: null
  orchestrator_profile: null
  fallback: block
  implementation_review_handoff:
    source_skill: implement
    required_command: /code-review
    target_profile: jellybase_jellyssh_reviewer
    target_bundle: code-quality-review
    state: required-fail-closed
promotion:
  candidate_routable: false
  operator_approval_required: true
  fresh_backup_required: true
